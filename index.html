<!doctype html>
<html>
<head>
	<title>
    Boba Store
  </title>
</head>
<body>
  <h1 class = "Store-Title">
    Boba Store
  </h1>
  <p1 class = "Text">
    Hi, im Nathan and welcome to my boba store
  </p1>
<div style="display: flex; gap: 120px;">
  <div>
    <h3 class="h3">Brown Sugar Boba</h3>
     <img class = "brown_sugar" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSmsW8fRbBYV1NWvAp2xJZ8n6neVW4c3qNAJjVYjM0TPw03RX_BR7Qlxu0&s=10">
  </div>
  
  <div>
    <h3 class = "h3">Recipe</h3>
    
    <h5 style="margin-left: -15px;" class = "ingredients-title">Milk Tea Base</h5>
    
    <ul style="margin-left: -90px;" class = "ingredients">
  
      <li>6 cup milk</li>
      <li>3 tablespoon light brown sugar</li>
      <li>2 tablespoon loose black tea leaves (or 4 tea bags)</li>
      <li>Ice</li>
    </ul>
    <div style="margin-top: 20px; font-family: sans-serif;">
      <button  onclick="document.getElementById('count').innerText++" class = "likeBtn">
        ❤️ Like
      </button>
      <p style="margin: 8px 0 0 0; font-size: 14px; color: #555;">
          <span id="count">0</span> likes
      </p>
    </div>

  </div>
</div>
</body>
</html>
